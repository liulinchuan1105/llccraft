version: '3.9'

services:
  wordpress:
    image: wordpress:6-php8.2-apache
    container_name: llccraft-wp
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_DB_NAME: wp_db
      WORDPRESS_DEBUG: 1
    volumes:
      - wordpress_data:/var/www/html
      # llccraft-child 子主题从仓库实时绑定 → 改代码立即生效
      - ../主题与设计/子主题(Child Theme)/llccraft-child:/var/www/html/wp-content/themes/llccraft-child
    depends_on:
      db:
        condition: service_healthy
    networks:
      - llccraft-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/wp-login.php || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  db:
    image: mariadb:10.11
    container_name: llccraft-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wp_db
      MARIADB_USER: wp_user
      MARIADB_PASSWORD: ${WP_DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - llccraft-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 12

  wpcli:
    image: wordpress:cli-php8.2
    container_name: llccraft-wpcli
    profiles: ["tools"]
    environment:
      # 关键：wpcli 容器也带 DB env vars(否则 wp-config.php 的 getenv_docker fallback 到 'mysql',找不到)
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_DB_NAME: wp_db
    volumes:
      - wordpress_data:/var/www/html
      - ../主题与设计/子主题(Child Theme)/llccraft-child:/var/www/html/wp-content/themes/llccraft-child
    networks:
      - llccraft-net
    depends_on:
      wordpress:
        condition: service_healthy
    entrypoint: ["wp"]

networks:
  llccraft-net:
    driver: bridge

volumes:
  wordpress_data:
  db_data:
