<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLCCRAFT · Sign In · v1.0.0</title>
<meta name="description" content="LLCCRAFT P-05 Auth page. v1.0.0. Glassmorphism card. Reuses Lumina 14-line glass parameters. Inherits P-01 v0.4.1.6 constitution (Phase 3.5 chassis).">

<!--
  ============================================================================
  P-05 Auth · v1.0.0 · PHASE 3.5 (parallel to chassis refactor)
  ============================================================================
  Inherits from P-01 v0.4.1.6 (LOCKED + Phase 3.5 patch):
    - Helvetica Regular @font-face (5 formats, ACTIVE)
    - Global Sticky Header (consistent across P-01/02/03)
    - Impeccable 宪法 :  skiplink / focus-visible / reduced-motion
    - WCAG 2.1 AA  :  contrast / keyboard / aria
    - Lumina 14-line glass parameters  -  reused + HEAVIER blur (20px)
  New for P-05:
    [BG] Background image  -  full-screen placeholder, easy to swap
    [GL] Glassmorphism card  -  centered, blur 20px + saturate 140%
    [GG] Continue with Google  -  prominent CTA (white pill, full-color icon)
    [EM] Email + Password + Sign in  -  minimal form, glassy inputs
    [JN] Join Now / Apply to become a collector  - 极简跳转
  ============================================================================
-->

<!-- Tailwind Play CDN : self-contained skeleton render -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'gallery':  'oklch(0.97 0.012 90)',
          'ink':      'oklch(0.20 0.010 28)',
          'ink-soft': 'oklch(0.55 0.008 28)',
          'rule':     'oklch(0.88 0.005 28)',
        },
        fontFamily: {
          serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
          sans:  ['"Helvetica Regular"', '"Inter"', 'system-ui', 'sans-serif'],
        },
        maxWidth: { 'wide': '1320px' },
      }
    }
  }
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ==========================================================================
     P-05 Auth v1.0.0
     ========================================================================== */

  /* ---------- F1 : Helvetica Regular @font-face (inherited, ACTIVE) ---------- */
  @font-face {
    font-family: "Helvetica Regular";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.eot");
    src: url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.eot?#iefix")format("embedded-opentype"),
         url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.woff2")format("woff2"),
         url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.woff")format("woff"),
         url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.ttf")format("truetype"),
         url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.svg#Helvetica Regular")format("svg");
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #000;
    color: #fff;
    font-family: "Helvetica Regular", "Inter", system-ui, -apple-system, sans-serif;
    font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- A11Y ---------- */
  .skiplink {
    position: fixed; top: -100px; left: 12px; z-index: 200;
    padding: 8px 24px; background: #000; color: #fff;
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    border-radius: 2px; text-decoration: none; font-weight: 500;
    transition: top 240ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .skiplink:focus { top: 12px; }
  :focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ---------- [BG] Full-screen background image (easy to swap) ----------
     TO REPLACE : change the URL in the --auth-bg-image CSS custom property
     (or swap the picsum URL below).  All visual layers key off this var. */
  :root {
    --auth-bg-image: url('https://picsum.photos/1920/1080?random=88');
  }
  .auth-bg {
    position: fixed; inset: 0; z-index: 0;
    background-image: var(--auth-bg-image);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .auth-bg::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.35) 0%,
      rgba(0,0,0,0.20) 50%,
      rgba(0,0,0,0.55) 100%);
  }

  /* ---------- Back to home (top-left) ---------- */
  .auth-back {
    position: fixed; top: 24px; left: 24px; z-index: 10;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    background: transparent;
    color: #fff; text-decoration: none;
    font-family: "Helvetica Regular", "Inter", sans-serif;
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    opacity: 0.7;
    transition: opacity 200ms ease, background 200ms ease;
    border-radius: 999px;
  }
  .auth-back:hover { opacity: 1; background: rgba(255, 255, 255, 0.08); }

  /* ---------- Page layout : centered ---------- */
  .auth-page {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 96px 24px;
  }

  /* ---------- [GL] Glassmorphism card  -  reuses Lumina params + heavier blur ---------- */
  .auth-card {
    position: relative;
    width: 100%;
    max-width: 440px;
    padding: 48px 40px;
    /* Lumina 14-line CSS reuse (verbatim structure, heavier blur for auth) */
    background: rgba(255, 255, 255, 0.06);
    background-blend-mode: luminosity;
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: none;
    border-radius: 12px;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15),
                0 16px 48px rgba(0, 0, 0, 0.35);
    color: #fff;
    overflow: hidden;
  }
  /* Lumina gradient-border mask (verbatim structure, lighter gradient) */
  .auth-card::before {
    content: ''; position: absolute; inset: 0;
    border-radius: inherit; padding: 1.4px;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.50) 0%,
      rgba(255,255,255,0.18) 20%,
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0) 60%,
      rgba(255,255,255,0.18) 80%,
      rgba(255,255,255,0.50) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none;
  }
  .auth-card__inner { position: relative; z-index: 1; }

  .auth-card__title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 32px; font-weight: 500;
    margin: 0 0 8px; line-height: 1.1;
    text-align: center; color: #fff;
    letter-spacing: -0.01em;
  }
  .auth-card__subtitle {
    font-family: "Helvetica Regular", "Inter", sans-serif;
    font-size: 13px; color: rgba(255, 255, 255, 0.7);
    margin: 0 0 32px; text-align: center;
    letter-spacing: 0.02em;
  }

  /* ---------- [GG] Continue with Google (prominent CTA) ---------- */
  .auth-google {
    display: flex; align-items: center; justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 14px 20px;
    background: #fff;
    color: oklch(0.20 0.010 28);
    border: none; border-radius: 999px;
    font-family: "Helvetica Regular", "Inter", sans-serif;
    font-size: 14px; font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 200ms ease, transform 100ms ease;
    margin-bottom: 24px;
  }
  .auth-google:hover { background: rgba(255, 255, 255, 0.92); }
  .auth-google:active { transform: scale(0.99); }
  .auth-google__icon { width: 18px; height: 18px; flex-shrink: 0; }

  /* ---------- Divider (or) ---------- */
  .auth-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 0 0 24px;
    color: rgba(255, 255, 255, 0.5);
    font-family: "Helvetica Regular", "Inter", sans-serif;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  }
  .auth-divider::before, .auth-divider::after {
    content: ''; flex: 1; height: 1px;
    background: rgba(255, 255, 255, 0.15);
  }

  /* ---------- Form fields ---------- */
  .auth-field { margin-bottom: 16px; }
  .auth-field__label {
    display: block;
    font-family: "Helvetica Regular", "Inter", sans-serif;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(255, 255, 255, 0.75);
    margin-bottom: 8px; font-weight: 500;
  }
  .auth-field__input {
    display: block; width: 100%;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    color: #fff;
    font-family: "Helvetica Regular", "Inter", sans-serif;
    font-size: 14px;
    transition: background 200ms ease, border-color 200ms ease;
  }
  .auth-field__input::placeholder { color: rgba(255, 255, 255, 0.4); }
  .auth-field__input:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.45);
  }

  /* ---------- Sign in submit ---------- */
  .auth-submit {
    display: block; width: 100%;
    padding: 14px 20px;
    background: oklch(0.42 0.165 27);
    color: #fff;
    border: none; border-radius: 999px;
    font-family: "Helvetica Regular", "Inter", sans-serif;
    font-size: 13px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    cursor: pointer;
    transition: background 200ms ease;
    margin-top: 8px;
  }
  .auth-submit:hover { background: oklch(0.50 0.18 27); }

  /* ---------- [JN] Join Now / Apply to become a collector ---------- */
  .auth-join {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    text-align: center;
  }
  .auth-join__text {
    font-family: "Helvetica Regular", "Inter", sans-serif;
    font-size: 12px; color: rgba(255, 255, 255, 0.6);
    margin: 0 0 12px; letter-spacing: 0.02em;
  }
  .auth-join__link {
    display: inline-block;
    font-family: "Helvetica Regular", "Inter", sans-serif;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: #fff;
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.4);
    padding-bottom: 2px;
    transition: border-color 200ms ease, color 200ms ease;
  }
  .auth-join__link:hover {
    color: oklch(0.72 0.025 85);
    border-color: oklch(0.72 0.025 85);
  }
</style>
</head>
<body>

<!-- A11Y skiplink -->
<a href="#main" class="skiplink">Skip to main content</a>

<!-- [BG] Full-screen placeholder background (CSS var for easy swap) -->
<div class="auth-bg" aria-hidden="true"></div>

<!-- Back to LLCCRAFT home -->
<a href="p01-home.html" class="auth-back" aria-label="Back to LLCCRAFT home">&larr; LLCCRAFT</a>

<main id="main" class="auth-page">

  <!-- [GL] Centered Glassmorphism card (Lumina params + heavier blur) -->
  <section class="auth-card" aria-label="Sign in to LLCCRAFT">
    <div class="auth-card__inner">

      <h1 class="auth-card__title">登入 / Sign in</h1>
      <p class="auth-card__subtitle">Continue your acquisition journey</p>

      <!-- [GG] Continue with Google - PROMINENT primary CTA -->
      <button class="auth-google" type="button" id="auth-google-btn">
        <svg class="auth-google__icon" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.02-3.7H.96v2.32A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.98 10.72A5.41 5.41 0 0 1 3.68 9c0-.6.1-1.18.3-1.72V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.04l3.02-2.32z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 9 0 9 9 0 0 0 .96 4.96L3.98 7.28C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>

      <div class="auth-divider" aria-hidden="true">or</div>

      <form id="auth-form" novalidate>
        <div class="auth-field">
          <label class="auth-field__label" for="auth-email">Email</label>
          <input class="auth-field__input" type="email" id="auth-email" name="email"
                 placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label class="auth-field__label" for="auth-password">Password</label>
          <input class="auth-field__input" type="password" id="auth-password" name="password"
                 placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password" required>
        </div>
        <button class="auth-submit" type="submit">登入 / Sign in</button>
      </form>

      <!-- [JN] Join Now / Apply to become a collector (极简跳转) -->
      <div class="auth-join">
        <p class="auth-join__text">Not a collector yet?</p>
        <a href="#" class="auth-join__link">申请加入 / Join Now >Join Now &middot; Apply to become a collector<middot; Apply to become a collector</a>
      </div>

    </div>
  </section>

</main>

<script>
  /* ==========================================================================
     P-05 Auth JS  v1.0.0
     ==========================================================================
     Modules (skeleton - no real backend):
       1. Google OAuth  -  alert stub (would redirect to /auth/google)
       2. Email/password sign-in  -  alert stub (would POST to /api/auth)
     ========================================================================== */

  (function () {
    /* 1. Continue with Google */
    const googleBtn = document.getElementById('auth-google-btn');
    if (googleBtn) {
      googleBtn.addEventListener('click', () => {
        /* skeleton : would window.location = '/auth/google' */
        alert('Skeleton: would redirect to OAuth provider (Google).\nFlow: /auth/google -> callback -> /p01-home.html');
      });
    }

    /* 2. Email + password sign-in */
    const form = document.getElementById('auth-form');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = form.email.value.trim();
        const password = form.password.value;
        if (!email || !password) {
          alert('Email and password are required.');
          return;
        }
        /* skeleton : would POST to /api/auth/login */
        alert('Skeleton: would POST to /api/auth/login.\nEmail: ' + email);
      });
    }
  })();
</script>

</body>
</html>
