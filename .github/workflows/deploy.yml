name: Deploy Theme to ECS

on:
  push:
    branches: [ main ]
    paths:
      - '4-建站-WordPress/主题与设计/子主题(Child Theme)/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-to-ecs
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ECS_HOST: ${{ secrets.LLCCRAFT_HOST }}
      ECS_PORT: "49821"
      ECS_USER: gitdep
      THEME_SRC: '4-建站-WordPress/主题与设计/子主题\(Child Theme\)/llccraft-child'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false

      - name: Build theme
        working-directory: ${{ env.THEME_SRC }}
        run: |
          set -e
          npm ci --no-audit --no-fund
          if ! npm run build; then
            echo "::error::build failed"
            exit 1
          fi
          test -f build/assets/main.css || { echo "::error::main.css missing"; exit 1; }
          BYTES=$(wc -c < build/assets/main.css)
          echo "build OK: $BYTES bytes"
          [ "$BYTES" -gt 1000 ] || { echo "::error::artifact too small"; exit 1; }

      - name: Setup SSH key and verify
        env:
          SSHK: ${{ secrets.LLCCRAFT_DEPLOY_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s" "$SSHK" > ~/.ssh/llccraft_deploy
          chmod 600 ~/.ssh/llccraft_deploy
          echo "::debug::key size: $(wc -c < ~/.ssh/llccraft_deploy) bytes"
          TEST_FILE=$(mktemp)
          echo "test-$(date +%s)" > "$TEST_FILE"
          if ! rsync -avz -e "ssh -p $ECS_PORT -i ~/.ssh/llccraft_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" "$TEST_FILE" "${ECS_USER}@${ECS_HOST}:/tmp/ssh-test-write-by-actions" 2>&1 | tee /tmp/rsync-test.log; then
            echo "::error::rsync auth failed"
            cat /tmp/rsync-test.log
            rm -f "$TEST_FILE"
            exit 1
          fi
          rsync -avz --delete -e "ssh -p $ECS_PORT -i ~/.ssh/llccraft_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" --include="ssh-test-write-by-actions" --exclude="*" "${ECS_USER}@${ECS_HOST}:/tmp/" /tmp/cleanup-staging/ 2>&1 | tail -3 || true
          rm -f "$TEST_FILE"
          echo "::notice::SSH + gitdep key + rsync verified"

      - name: Sync build artifact
        run: |
          set -e
          SRC="${THEME_SRC}/build/assets/main.css"
          DEST="${ECS_USER}@${ECS_HOST}:/var/www/llccraft/wp-content/themes/llccraft-child/build/assets/main.css"
          if ! rsync -avz -e "ssh -p $ECS_PORT -i ~/.ssh/llccraft_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" "$SRC" "$DEST"; then
            echo "::error::rsync failed"
            exit 1
          fi
          echo "rsync OK"

      - name: Verify HTTP 200
        run: |
          set -e
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: llccraft.com" "http://${ECS_HOST}/wp-login.php")
          echo "wp-login.php status: $STATUS"
          [ "$STATUS" = "200" ] || { echo "FAIL: HTTP $STATUS"; exit 1; }
          STATUS2=$(curl -s -o /dev/null -w "%{http_code}" "https://llccraft.com/wp-login.php")
          echo "https status: $STATUS2"
          [ "$STATUS2" = "200" ] || { echo "FAIL: HTTPS $STATUS2"; exit 1; }
          echo "All probes OK"
