name: Deploy Theme to ECS

on:
  push:
    branches: [ main ]
    paths:
      - '4-建站-WordPress/主题与设计/子主题(Child Theme)/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Concurrency: 同时只允许 1 次 deploy(避免并发锁)
concurrency:
  group: deploy-to-ecs
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ECS_HOST: ${{ secrets.LLCCRAFT_HOST }}
      ECS_PORT: '49821'
      ECS_USER: gitdep   # 强制 actions-only 用户(无 sudo)
      THEME_SRC: '4-建站-WordPress/主题与设计/子主题(Child Theme)/llccraft-child'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (locked, no cache to avoid cache-dependency-path Chinese path issues)
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # locked
          check-latest: false
          cache: 'npm'         # 启用 npm cache
          cache-dependency-path: 4-建站-WordPress/主题与设计/子主题(Child Theme)/llccraft-child/package-lock.json  # 显式路径,避 runner.workspace 解析

      - name: Build theme (Vite + Tailwind) — fail-fast
        working-directory: ${{ env.THEME_SRC }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          # 用 if ! 包 npm run build — npm 8+ 包装子 exit 不可靠(可能返回 0 即使失败)
          npm run build || { echo "::error::npm run build FAILED (see above log for vite/postcss error)"; exit 1; }
          test -f build/assets/main.css || { echo "::error::build/assets/main.css missing after build"; exit 1; }
          BYTES=$(wc -c < build/assets/main.css)
          echo "build OK: $BYTES bytes"
          [ "$BYTES" -gt 1000 ] || { echo "::error::build artifact too small: $BYTES bytes (expected > 1 KB)"; exit 1; }

      - name: Setup SSH key (Deploy Key, Actions-only)
        env:
          SSHK: ${{ secrets.LLCCRAFT_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSHK" > ~/.ssh/llccraft_deploy
          chmod 600 ~/.ssh/llccraft_deploy
          # test connect(没有任何命令,SSH should reject as command= 强制但不匹配)
          if ! ssh -p "$ECS_PORT" -i ~/.ssh/llccraft_deploy \
                -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -o BatchMode=yes \
                "$ECS_USER@$ECS_HOST" true; then
              echo "::error::SSH connect to gitdep@ECS failed"
              exit 1
          fi
          echo "SSH + gitdep key verified"

      - name: Sync build artifact (rsync via gitdep restricted command=)
        run: |
          set -euo pipefail
          # rsync -e ssh 用 deploy key + 49821 端口
          # gitdep 端 authorized_keys command="...rsync --server ... --delete . /var/www/llccraft/wp-content/themes/llccraft-child/"
          # → gitdep 只能跑这一条 rsync-server 命令,锁死在 theme dir
          if ! rsync -avz -e "ssh -p $ECS_PORT -i ~/.ssh/llccraft_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
                  ${{ env.THEME_SRC }}/build/assets/main.css \
                  ${{ env.ECS_USER }}@${{ env.ECS_HOST }}:/var/www/llccraft/wp-content/themes/llccraft-child/build/assets/main.css; then
              echo "::error::rsync failed (check gitdep authorized_keys / theme dir perms)"
              exit 1
          fi
          echo "rsync OK: build/main.css deployed to llccraft-child/build/assets/main.css"

      - name: Verify HTTP 200 (no silent fail)
        run: |
          set -euo pipefail
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: llccraft.com" "http://$ECS_HOST/wp-login.php")
          echo "wp-login.php status: $STATUS"
          [ "$STATUS" = "200" ] || { echo "FAIL: HTTP $STATUS"; exit 1; }

          STATUS2=$(curl -s -o /dev/null -w "%{http_code}" "https://llccraft.com/wp-login.php")
          echo "https llccraft.com/wp-login.php status: $STATUS2"
          [ "$STATUS2" = "200" ] || { echo "FAIL: HTTPS $STATUS2"; exit 1; }

          echo "All probes OK"
