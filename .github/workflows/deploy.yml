name: Deploy Theme to ECS

on:
  push:
    branches: [ main ]
    paths:
      - '4-建站-WordPress/主题与设计/子主题(Child Theme)/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-to-ecs
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ECS_HOST: ${{ secrets.LLCCRAFT_HOST }}
      ECS_PORT: "49821"
      ECS_USER: gitdep
      THEME_SRC: '4-建站-WordPress/主题与设计/子主题(Child Theme)/llccraft-child'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false

      - name: MD5 ledger gate (云端防线 · 仅当本地账本 100% 匹配才放行)
        run: |
          set -e
          LEDGER=".impeccable/config.json"
          THEME_DIR="$THEME_SRC"
          echo "── Ledger gate check ──"
          # Extract MD5s from ledger (parse "file" + "md5" pairs)
          ledger_md5s=$(python3 -c "
          import json, sys
          with open('$LEDGER') as f: cfg = json.load(f)
          for p in cfg.get('pages', []):
              fn = p.get('file', '')
              md5 = p.get('md5', '')
              if fn and md5: print(f'{fn} {md5}')
          ")
          fail=0
          while IFS=' ' read -r fn expected_md5; do
            [ -z "$fn" ] && continue
            actual_md5=$(md5sum "$THEME_DIR/$fn" 2>/dev/null | awk '{print $1}')
            if [ "$actual_md5" != "$expected_md5" ]; then
              echo "  ::error::$fn  ledger=$expected_md5  disk=$actual_md5"
              fail=1
            else
              echo "  ok  $fn  $actual_md5"
            fi
          done <<< "$ledger_md5s"
          if [ "$fail" -ne 0 ]; then
            echo "::error::MD5 ledger gate FAILED — disk drift detected"
            exit 1
          fi
          echo "── Ledger gate PASS · 8/8 MD5 aligned · deployment authorized ──"

      - name: Build theme
        run: |
          set -e
          cd "$THEME_SRC"
          npm ci --no-audit --no-fund
          if ! npm run build; then
            echo "::error::build failed"
            exit 1
          fi
          test -f build/assets/main.css || { echo "::error::main.css missing"; exit 1; }
          BYTES=$(wc -c < build/assets/main.css)
          echo "build OK: $BYTES bytes"
          [ "$BYTES" -gt 1000 ] || { echo "::error::artifact too small"; exit 1; }

      - name: Setup SSH key and verify
        env:
          SSHK: ${{ secrets.LLCCRAFT_DEPLOY_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$SSHK" > ~/.ssh/llccraft_deploy
          chmod 600 ~/.ssh/llccraft_deploy
          echo "::debug::key size: $(wc -c < ~/.ssh/llccraft_deploy) bytes"
          TEST_FILE=$(mktemp)
          echo "test-$(date +%s)" > "$TEST_FILE"
          if ! rsync -avz -e "ssh -p $ECS_PORT -i ~/.ssh/llccraft_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" "$TEST_FILE" "${ECS_USER}@${ECS_HOST}:/tmp/ssh-test-write-by-actions" 2>&1 | tee /tmp/rsync-test.log; then
            echo "::error::rsync auth failed"
            cat /tmp/rsync-test.log
            rm -f "$TEST_FILE"
            exit 1
          fi
          rsync -avz --delete -e "ssh -p $ECS_PORT -i ~/.ssh/llccraft_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" --include="ssh-test-write-by-actions" --exclude="*" "${ECS_USER}@${ECS_HOST}:/tmp/" /tmp/cleanup-staging/ 2>&1 | tail -3 || true
          rm -f "$TEST_FILE"
          echo "::notice::SSH + gitdep key + rsync verified"

      - name: Sync build artifact
        run: |
          set -e
          SRC="$THEME_SRC/build/assets/main.css"
          DEST="${ECS_USER}@${ECS_HOST}:/var/www/llccraft/wp-content/themes/llccraft-child/build/assets/main.css"
          # --mkpath: rsync 3.2+ 自动建多级 dest dir (build/assets)
          if ! rsync -avz --mkpath -e "ssh -p $ECS_PORT -i ~/.ssh/llccraft_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" "$SRC" "$DEST"; then
            echo "::error::rsync failed"
            exit 1
          fi
          echo "rsync OK"

      - name: Verify HTTP 200
        run: |
          set -e
          # -L follows redirects (HTTP 301 to HTTPS or vice versa)
          STATUS=$(curl -skL -o /dev/null -w "%{http_code}" -H "Host: llccraft.com" "https://llccraft.com/wp-login.php")
          echo "wp-login.php status: $STATUS"
          [ "$STATUS" = "200" ] || { echo "FAIL: HTTP $STATUS"; exit 1; }
          echo "All probes OK"
